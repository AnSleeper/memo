<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>不许忘！</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">

  <header id="titlebar" data-tauri-drag-region="deep">
    <button id="btnSettings" class="icon-btn" title="设置">⚙</button>
    <button id="btnTrashTop" class="icon-btn" title="回收站">🗑</button>
    <span id="appName">不许忘！</span>
    <div class="drag-fill"></div>
    <span id="kbdHint">Ctrl + Alt + Space</span>
    <div class="win-ctrls">
      <button id="btnMin" class="icon-btn win-btn" title="最小化">─</button>
      <button id="btnMax" class="icon-btn win-btn" title="最大化">▢</button>
      <button id="btnClose" class="icon-btn win-btn" title="关闭">✕</button>
    </div>
  </header>

  <div id="toolbar">
    <input id="search" type="text" placeholder="搜索标题、内容、媒体文件名…" autocomplete="off" spellcheck="false">
    <button id="btnNew" class="btn primary">＋ 新条目</button>
  </div>

  <main id="main">
    <div id="tree" class="tree"></div>
    <section id="detail" class="detail"></section>
  </main>

  <footer id="footbar">
    <span id="foot">拖动任意一行改顺序或换父级</span>
    <span class="dot">·</span><span>点一次选中，再点一次回到空选</span>
    <span class="dot">·</span><span>勾选完成后本次顺序不变，下次打开排到同级最后</span>
  </footer>

  <div id="settings" class="overlay" hidden>
    <div class="ov-head">设置<button class="btn" id="setClose">关闭</button></div>
    <div class="ov-body">
      <div class="sec">
        <div class="sec-label">外观</div>
        <div class="skins" id="skinList">
          <button class="skin" data-skin="green"><i style="background:#3FB98F"></i>暗墨绿</button>
          <button class="skin" data-skin="amber"><i style="background:#D89A4A"></i>暖琥珀</button>
          <button class="skin" data-skin="blue"><i style="background:#6B9CC4"></i>雾蓝灰</button>
          <button class="skin" data-skin="graphite"><i style="background:#AEB6BE"></i>中性石墨</button>
          <button class="skin" data-skin="sakura"><i style="background:#E4679B"></i>樱粉</button>
        </div>
        <div class="srow"><span class="k">程序显示名</span><span class="v"><input id="nameInput" class="inp" maxlength="24" placeholder="显示在窗口顶部"></span></div>
      </div>
      <div class="sec">
        <div class="sec-label">程序设置</div>
        <div class="srow"><span class="k">数据目录</span><span class="v ell" id="dataDirText"></span><button class="btn" id="btnPickDir">更改</button><button class="btn" id="btnOpenDir">打开</button></div>
        <div class="srow"><span class="k">全局快捷键</span><span class="v"><input id="scInput" class="inp" placeholder="Ctrl+Alt+Space"></span><button class="btn" id="btnScSave">保存</button></div>
        <div class="srow"><span class="k">回收站保留</span><span class="v"><select id="retention" class="inp">
          <option value="7">7 天</option>
          <option value="30">30 天</option>
          <option value="90">90 天</option>
          <option value="0">永久保留</option>
        </select></span><button class="btn" id="btnTrash">打开回收站</button></div>
        <div class="srow"><span class="k">开机自启动</span><span class="v" id="autostartText">关闭，不影响开机速度</span><span class="sw" id="swStart" role="switch" tabindex="0" aria-checked="false"><i></i></span></div>
        <div class="srow"><span class="k">关闭按钮</span><span class="v"><select id="closeAction" class="inp">
          <option value="exit">彻底关闭程序</option>
          <option value="tray">最小化到托盘</option>
        </select></span></div>
        <div class="srow"><span class="k">新建待办位置</span><span class="v"><select id="newItemPos" class="inp">
          <option value="top">排在同级最上面</option>
          <option value="bottom">排在同级最下面</option>
        </select></span></div>
        <div class="srow"><span class="k">窗口位置</span><span class="v ell">移动和缩放都会自动记住</span><button class="btn" id="btnResetGeom">恢复默认大小</button></div>
      </div>
    </div>
  </div>

  <div id="trash" class="overlay" hidden>
    <div class="ov-head">回收站<button class="btn" id="trashClose">关闭</button></div>
    <div class="ov-body" id="trashList"></div>
  </div>

  <div id="ctx" class="ctxmenu" hidden></div>
  <div id="remindPop" class="remind-pop" hidden></div>
  <div id="toast" class="toast" hidden></div>
</div>
<script src="app.js"></script>
</body>
</html>
